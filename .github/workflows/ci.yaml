name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push during a CI wait cancels the run, which revloop reads as a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by sha. Dependabot updates the sha and the version comment together.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: npm ci
      - name: Prettier and markdownlint
        run: npm run check:docs
      - name: shellcheck the extracted fences
        run: npm run lint:sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: npm ci
      - name: Fence and schema tests
        run: npm test

  # Not part of `check:all`, which has to run offline.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: npm ci
      - name: npm audit
        run: npm run audit
