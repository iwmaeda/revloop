name: Reviewer measurement
description: You drove a reviewer end to end and measured how it behaves
labels: [reviewer-card]
body:
  - type: markdown
    attributes:
      value: |
        A card records what you observed when you drove the reviewer, not what its documentation
        says. This form is for a bot that a comment triggers. See
        [docs/adding-a-reviewer.md](https://github.com/iwmaeda/revloop/blob/main/docs/adding-a-reviewer.md),
        which covers local command reviewers too.

  - type: input
    id: name
    attributes:
      label: Reviewer name
      placeholder: acme
    validations:
      required: true

  - type: input
    id: trigger
    attributes:
      label: What text triggers it
      placeholder: "@acme review"
    validations:
      required: true

  - type: input
    id: bot-login
    attributes:
      label: The login it posts as
      description: Write it with the `[bot]` suffix. revloop strips it before comparing against GraphQL.
      placeholder: acme-reviewer[bot]
    validations:
      required: true

  - type: input
    id: clean
    attributes:
      label: What it says when it finds nothing
      description: Quote the prefix. Reviewers append chatter that varies between rounds.
      placeholder: "Acme Review: no issues found"
    validations:
      required: true

  - type: input
    id: rate-limit
    attributes:
      label: What it says when it is rate-limited
      placeholder: quota exceeded

  - type: dropdown
    id: verdict-on
    attributes:
      label: Where the verdict arrived
      options:
        - a review
        - an issue comment
        - both, in the same round
        - something else (explain below)
    validations:
      required: true

  - type: input
    id: latency
    attributes:
      label: How long it took
      placeholder: 3-4m
    validations:
      required: true

  - type: input
    id: findings
    attributes:
      label: Findings per round
      description: The number that decides whether sweeping for siblings is worth a round.
      placeholder: 1-4

  - type: dropdown
    id: marker
    attributes:
      label: Did it still answer with the revloop marker appended?
      options:
        - "yes — measured"
        - "no — it ignored the trigger"
        - "not tested"
    validations:
      required: true

  - type: input
    id: preamble
    attributes:
      label: Does it post anything before the real review?
      description: >-
        Quote the first line exactly. The loop skips a preamble the wait fence does not know by
        marking it, under the rule in step 9's skip bullet of the procedure; a fence edit removes
        the stops that rule can cause.
      placeholder: "## Summary of Changes"

  - type: textarea
    id: provenance
    attributes:
      label: Where this was measured
      description: >-
        The card cites this for every observation. A public pull request: `owner/repo#8`. A private
        repository: `repo B` and the month, as in "repo B, 2026-08". An installed command: its exact
        version and the month, as in "ecc 2.2.0, 2026-09".
    validations:
      required: true
