# Single source of truth for the toolchain: a version is stated once here,
# instead of duplicated (or left implicit) across CI and a developer's machine.
#
# The granularity is deliberate. Node's version does not change what the tests
# decide, so it floats on the major (and can still drift a patch version
# between an existing local install and a fresh CI one — `mise install` does
# not upgrade an already-satisfying version). shellcheck's and jq's versions
# ARE the verdict — a new shellcheck release adds checks, and the jq program
# inside the wait-verdict fence is exercised against recorded payloads — so
# both are pinned exactly. jq is pinned to 1.7.1, the final patch of the 1.7.x
# series ubuntu-latest carried when this was written; shellcheck is pinned to
# 0.9.0, matching the image exactly. Raise them deliberately, in their own
# commit.
[tools]
node = "24"
jq = "1.7.1"
shellcheck = "0.9.0"
